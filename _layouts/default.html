<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
  <nav class="main-nav">
    <ul>
      <li><a href="{{ '/' | relative_url }}">🏕️ Home</a></li>
      <li><a href="{{ '/about/' | relative_url }}">🧭 Adventure</a>
        <ul class="submenu">
          <li><a href="{{ '/about/surroundings/' | relative_url }}">Examine Surroundings</a></li>
          <li><a href="{{ '/about/creator/' | relative_url }}">Meet the Creator</a></li>
          <li><a href="{{ '/about/inventory/' | relative_url }}">Check Inventory</a></li>
        </ul>
      </li>
      <!-- <li><a href="{{ '/tag/index.html' | relative_url }}">🏷️ Browse by Tag</a></li> -->
    </ul>
  </nav>
  <style>
    .main-nav ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.5em; }
    .main-nav li { position: relative; }
    .main-nav > ul > li { font-weight: bold; }
    .main-nav a { text-decoration: none; color: #2d2d2d; }
    .main-nav .submenu { display: none; position: absolute; left: 0; top: 100%; background: #fffbe9; border: 1px solid #e0cfa9; border-radius: 0.5em; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 0.5em 1em; min-width: 180px; z-index: 10; }
    .main-nav li:hover > .submenu { display: block; }
    .main-nav .submenu li { font-weight: normal; margin: 0.5em 0; }
    .main-nav .submenu a { color: #4b3f2a; }
  </style>
  <main>
    {{ content }}
  </main>
</body>
</html>
